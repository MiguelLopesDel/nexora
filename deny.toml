# Quality gate: dependency licenses, security advisories, and source
# provenance. Run `cargo deny check` locally; CI runs it on every PR.
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = false
no-default-features = false

[advisories]
ignore = [
    # { id = "RUSTSEC-0000-0000", reason = "why this is acceptable" },
]

[licenses]
# Every license actually present in the dependency tree today (see the
# `cargo deny check licenses` output this was built from). A new license
# showing up means a new dependency introduced it — review it, then add it
# here deliberately rather than widening this to something permissive.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "CC0-1.0",
    "MIT-0",
    "CDLA-Permissive-2.0",
    "Unlicense",
    "MPL-2.0",
    "AGPL-3.0-only", # nexora itself
]
confidence-threshold = 0.8

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
