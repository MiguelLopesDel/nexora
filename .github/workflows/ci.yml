name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    # Fedora ships gtk4-layer-shell; Ubuntu LTS (24.04) does not yet.
    container: fedora:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        # gcc-c++/cmake build the vendored whisper.cpp; clang-devel provides
        # the libclang that bindgen needs for its generated bindings.
        run: dnf install -y gcc gcc-c++ cmake clang-devel gtk4-devel gtk4-layer-shell-devel openssl-devel curl tar xz vulkan-loader-devel glslc

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-audit,cargo-llvm-cov

      - name: Format
        run: cargo fmt --check

      - name: File size gate
        run: ./scripts/check_file_sizes.sh

      - name: Clippy (includes complexity/size lints, see clippy.toml)
        run: cargo clippy --all-targets -- -D warnings

      - name: Dependency licenses, bans, and sources
        run: cargo deny check

      - name: Security advisories
        run: cargo audit

      - name: Tests
        run: cargo test

      - name: Coverage gate
        # Baseline measured 2026-08-21: ~23% lines/regions. Floor is set a
        # couple points under that so it can only go up over time, not down.
        run: cargo llvm-cov --fail-under-lines 20

      - name: Release build
        run: cargo build --release

      - name: Binary size report
        run: ls -lh target/release/nexora
